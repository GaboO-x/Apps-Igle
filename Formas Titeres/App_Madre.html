<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generador de patrones — App madre</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#14171b; --line:#2a2f36; --text:#e6e8eb;
    --muted:#8a9099; --accent:#4fd1c5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; background:var(--bg); overflow:hidden;}
  body{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;}

  #tabbar{
    position:fixed; top:12px; left:12px; z-index:1000;
    display:flex; gap:6px;
    background:#0e1114; border:1px solid var(--line);
    border-radius:8px; padding:4px;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  .tab{
    display:flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:6px;
    border:1px solid transparent;
    background:transparent; color:var(--muted);
    font-family:inherit; font-size:12px; letter-spacing:.03em;
    cursor:pointer; user-select:none;
  }
  .tab:hover{color:var(--text);}
  .tab.active{
    border-color:var(--accent);
    color:var(--accent);
    background:rgba(79,209,197,0.08);
  }
  .tab.active .check{display:inline;}
  .tab .check{display:none;}

  .frame-wrap{
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:none;
  }
  .frame-wrap.active{display:block;}
  iframe{
    width:100%; height:100%; border:none; display:block; background:var(--bg);
  }
</style>
</head>
<body>

<div id="tabbar">
  <button class="tab active" data-target="frame-formas">
    <span class="check">✓</span><span>Formas</span>
  </button>
  <button class="tab" data-target="frame-rostro">
    <span class="check">✓</span><span>Rostro</span>
  </button>
</div>

<div id="frame-formas" class="frame-wrap active">
  <iframe src="Formas.html" title="Formas de revolución"></iframe>
</div>
<div id="frame-rostro" class="frame-wrap">
  <iframe src="Rostro.html" title="Rostro (elipse asimétrica)"></iframe>
</div>

<script>
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.frame-wrap').forEach(f=>f.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.target).classList.add('active');
    });
  });
</script>

</body>
</html>
